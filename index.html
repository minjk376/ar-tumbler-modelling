<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Tumbler Prototype</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  <script type="module" src="/src/main.js"></script>
</head>

<body>
  <div id="ui">
    <label>
      아래 반지름
      <input id="bottomRadius" type="number" value="4" min="0" step="0.1" />
    </label>

    <label>
      높이
      <input id="height" type="number" value="8" min="0" step="0.1" />
    </label>

    <label>
      음료량(mL)
      <input id="drinkVolume" type="number" value="300" min="0" step="1" />
    </label>

    <div class="actions">
      <button id="updateCupButton" type="button">업데이트</button>
      <button id="showVolumeButton" type="button">부피 확인하기</button>
    </div>

    <div id="result" aria-live="polite"></div>
    <div id="volumeInfo" hidden></div>
    <audio id="overflowSound" src="splash.mp3"></audio>
  </div>

  <a-scene
    embedded
    arjs
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
  >
    <a-entity camera></a-entity>

    <a-marker preset="hiro">
      <a-entity id="cup" scale="3 3 3"></a-entity>
    </a-marker>
  </a-scene>
</body>
</html>
