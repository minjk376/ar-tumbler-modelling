<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Tumbler Prototype</title>

  <script>
    ;(() => {
      const mediaDevices = navigator.mediaDevices

      if (!mediaDevices?.getUserMedia) {
        return
      }

      const originalGetUserMedia = mediaDevices.getUserMedia.bind(mediaDevices)

      mediaDevices.getUserMedia = (constraints = {}) => {
        if (!constraints.video) {
          return originalGetUserMedia(constraints)
        }

        const requestedVideo =
          typeof constraints.video === 'object' ? constraints.video : {}

        return originalGetUserMedia({
          ...constraints,
          video: {
            ...requestedVideo,
            facingMode: requestedVideo.facingMode ?? { ideal: 'environment' },
            width: requestedVideo.width ?? { ideal: 1280 },
            height: requestedVideo.height ?? { ideal: 720 },
            aspectRatio: requestedVideo.aspectRatio ?? { ideal: 16 / 9 },
            advanced: [
              ...(requestedVideo.advanced ?? []),
              { zoom: 1 },
            ],
          },
        })
      }
    })()
  </script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  <script type="module" src="/src/main.js"></script>
</head>

<body>
  <div id="ui">
    <fieldset class="mode-picker" aria-label="모드 선택">
      <legend>모드</legend>
      <label>
        <input id="modelMode" type="radio" name="mode" value="model" checked />
        모델 생성/수정
      </label>
      <label>
        <input id="overflowMode" type="radio" name="mode" value="overflow" />
        넘침 검증
      </label>
    </fieldset>

    <section id="modelControls" class="panel" aria-label="모델 생성/수정 설정">
      <label>
        도형
        <select id="shapeType">
          <option value="cylinder">원기둥</option>
          <option value="frustum">원뿔대</option>
        </select>
      </label>

      <div id="cylinderInputs">
        <label>
          반지름
          <input id="modelRadius" type="number" value="4" min="0" step="0.1" />
        </label>
      </div>

      <div id="frustumInputs" hidden>
        <label>
          윗반지름
          <input id="topRadius" type="number" value="3" min="0" step="0.1" />
        </label>

        <label>
          아랫반지름
          <input id="modelBottomRadius" type="number" value="5" min="0" step="0.1" />
        </label>

        <button id="swapFrustumRadiiButton" type="button">위아래 바꾸기</button>
      </div>

      <label>
        높이
        <input id="modelHeight" type="number" value="8" min="0" step="0.1" />
      </label>

      <div class="actions">
        <button id="addCylinderButton" type="button">원기둥 추가</button>
        <button id="addFrustumButton" type="button">원뿔대 추가</button>
      </div>

      <ol id="shapeList" class="shape-list" aria-label="생성된 도형 목록"></ol>

      <div class="actions">
        <button id="deleteShapeButton" type="button">선택 삭제</button>
        <button id="moveShapeUpButton" type="button">위로 이동</button>
        <button id="moveShapeDownButton" type="button">아래로 이동</button>
      </div>

      <div class="actions">
        <button id="rotateLeftButton" type="button">왼쪽 회전</button>
        <button id="rotateRightButton" type="button">오른쪽 회전</button>
        <button id="zoomOutButton" type="button">축소</button>
        <button id="zoomInButton" type="button">확대</button>
      </div>

      <div id="modelVolumeInfo" class="status" aria-live="polite"></div>
    </section>

    <section id="overflowControls" class="panel" aria-label="넘침 검증 설정" hidden>
      <label>
        아래 반지름
        <input id="bottomRadius" type="number" value="4" min="0" step="0.1" />
      </label>

      <label>
        높이
        <input id="height" type="number" value="8" min="0" step="0.1" />
      </label>

      <label>
        음료량(mL)
        <input id="drinkVolume" type="number" value="300" min="0" step="1" />
      </label>

      <div class="actions">
        <button id="updateCupButton" type="button">업데이트</button>
        <button id="showVolumeButton" type="button">부피 확인</button>
      </div>

      <div id="result" aria-live="polite"></div>
      <div id="volumeInfo" hidden></div>
    </section>

    <audio id="overflowSound" src="splash.mp3"></audio>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; alpha: true;"
  >
    <a-entity camera>
      <a-entity id="modelPreview" position="0 0 -2.4"></a-entity>
    </a-entity>

    <a-marker preset="hiro">
      <a-entity id="cup" scale="3 3 3"></a-entity>
    </a-marker>
  </a-scene>
</body>
</html>
